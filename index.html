<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rock, paper, scissors</title>

    </head>
    <body>
        <div id="scores">
            <div id="humanScore">You</div>
            <img src="assets/images/cherry-color.svg" height="16px" width="16px">
            <img src="assets/images/cherry-greyscale.svg" height="16px" width="16px">

            <img src="assets/images/cherry-greyscale.svg" height="16px" width="16px">

            <img src="assets/images/cherry-greyscale.svg" height="16px" width="16px">
        </div>
        <div id="humanChoices">
            <svg></svg>
            <button alt="Rock">
                <img src="assets/images/card-rock.svg" height="384px">
            </button>
            <button alt="Paper">
                <img src="assets/images/card-paper.svg" height="384px">
            </button>
            <button alt="Scissors">
                <img src="assets/images/card-scissors.svg" height="384px">
            </button>
        </div>
        <div id="score"></div>
        <div id="round"></div>
        <div id="result"></div>
